[project]
name = "metis-scheduler"
version = "0.1.0"
description = "Metis schedule synchronisation, reminder dispatch and notification delivery"
requires-python = ">=3.12"
dependencies = ["metis-contracts", "metis-state", "metis-pipeline"]

[project.optional-dependencies]
cloud = ["boto3>=1.35"]
push = ["pywebpush>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_scheduler"]
