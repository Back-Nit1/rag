[project]
name = "metis-planner"
version = "0.1.0"
description = "Metis planning: context assembly, outline generation and deterministic validation"
requires-python = ">=3.12"
dependencies = ["metis-contracts", "metis-state", "metis-pipeline", "metis-retrieval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_planner"]
