[project]
name = "metis-pipeline"
version = "0.1.0"
description = "Metis ingestion pipeline: jobs, extraction, transactional outbox dispatch"
requires-python = ">=3.12"
# boto3: StepFunctionsLauncher. metis-speech: finalize reads its result_key.
dependencies = ["metis-contracts", "metis-state", "metis-speech", "boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_pipeline"]
