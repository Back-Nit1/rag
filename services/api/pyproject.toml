[project]
name = "metis-api"
version = "0.1.0"
description = "Metis HTTP API (FastAPI) with a Lambda entry adapter"
requires-python = ">=3.12"
dependencies = [
  "metis-contracts",
  "metis-state",
  "metis-pipeline",
  "metis-scheduler",
  "metis-retrieval",
  "metis-planner",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
# A maintained ASGI-to-Lambda adapter, not a hand-written partial gateway
# translation.
lambda = ["mangum>=0.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_api"]
