[project]
name = "metis-retrieval"
version = "0.1.0"
description = "Metis semantic memory: ingestion, embeddings and owner-scoped retrieval"
requires-python = ">=3.12"
dependencies = ["metis-contracts", "metis-state", "metis-pipeline"]

[project.optional-dependencies]
cloud = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_retrieval"]
