[project]
name = "metis-contracts"
version = "1.0.0"
description = "Metis canonical data, API and event contracts (schema version 1)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metis_contracts"]
