# Coordinator-owned. No cloud credentials, no model downloads, no paid calls:
# real-ASR and AWS jobs are opt-in (workflow_dispatch) and not defined here.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make bootstrap
      - run: make check
      - run: make test
      - run: pnpm --filter @metis/web build
      - run: make synth
      - run: pnpm --filter @metis/infra test

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: make bootstrap
      - run: make desktop-test
