[package]
name = "metis-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Metis desktop shell"

[lib]
name = "metis_desktop_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
